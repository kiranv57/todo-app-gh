name: Continuous Integration Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# CI FinOps & Runner Concurrency Throttling (Cancel obsolete runs on new push)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # STAGE 1: FAST RUNNERS (Static Analysis, Hygiene, & Unit Test Gates)
  # ============================================================================

  docker-hygiene:
    name: Docker Hygiene & Layer Physics Gatekeeper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Dockerfiles for Non-Root USER and Layer Cache Invariant
        run: node scripts/check-docker-hygiene.js --strict

  test-shared-contracts:
    name: Shared Contracts Validation (@repo/shared)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Contracts Test Suite
        working-directory: packages/shared
        run: node --test 'tests/**/*.test.js'

  test-backend-api:
    name: Backend API Suite (@repo/api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute API Integration Suite
        working-directory: services/api
        env:
          JWT_SECRET: ci-test-runner-cryptographic-signing-key-32-chars
        run: node --test 'tests/**/*.test.js'

  test-frontend-web:
    name: Web Frontend Delivery Suite (@repo/web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Web SPA Suite
        working-directory: apps/web
        run: node --test 'tests/**/*.test.js'

  # ============================================================================
  # STAGE 2: HEAVY VM RUNNER (Docker Multi-Stage Build & Smoke Test Gate)
  # Reached strictly if all Stage 1 gates vote GREEN
  # ============================================================================

  docker-smoke-gate:
    name: Docker Smoke Test & Non-Root Boot Gate (Heavy VM)
    needs: [docker-hygiene, test-shared-contracts, test-backend-api, test-frontend-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Clean-Room Pull)
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Execute Docker Container Smoke Test Gate
        run: bash scripts/docker-smoke.sh
