name: Continuous Integration & Release Pipeline

# ==============================================================================
# Pipeline architecture (see docs/architecture/0002-immutable-artifacts-and-ci-cd-pipeline.md)
#
# Commit time (local):        scripts/pre-commit-gate.js — Stages 1 & 2
# Pull-request / push gates:  Stages 3, 4, 5 below
# Release gate (push to main) Stages 6 & 7 below
#
# Stage 3: Package test suites
# Stage 4: Dockerfile hygiene & security audit
# Stage 5: Container build & smoke certification (<150MB budget, /health probe)
# Stage 6: Full monorepo integration matrix
# Stage 7: Release images built and pinned to the exact Git commit SHA
# ==============================================================================

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Concurrency throttling: cancel superseded runs when a new push lands
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # PULL-REQUEST / PUSH VALIDATION (Stages 3, 4, 5)
  # ============================================================================

  # Stage 4: Dockerfile hygiene gates (linting & non-root USER verification)
  docker-hygiene-gate:
    name: "[Stage 4] Dockerfile Hygiene & Security Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Dockerfiles for non-root USER & layer caching invariants
        run: node scripts/check-docker-hygiene.js --strict

  # Stage 3: Package test suites
  test-shared-contracts:
    name: "[Stage 3] Shared Contracts (@repo/shared)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run shared contracts test suite
        working-directory: packages/shared
        run: node --test 'tests/**/*.test.js'

  test-backend-api:
    name: "[Stage 3] Backend API Suite (@repo/api)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run backend API test suite
        working-directory: services/api
        env:
          JWT_SECRET: ci-test-runner-cryptographic-signing-key-32-chars
        run: node --test 'tests/**/*.test.js'

  test-frontend-web:
    name: "[Stage 3] Web Frontend Suite (@repo/web)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run web frontend test suite
        working-directory: apps/web
        run: node --test 'tests/**/*.test.js'

  # Stage 5: Container build & smoke certification (<150MB size budget & /health probe)
  container-certification:
    name: "[Stage 5] Container Build & Smoke Certification"
    needs: [docker-hygiene-gate, test-shared-contracts, test-backend-api, test-frontend-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run container smoke test & size budget gate
        run: bash scripts/docker-smoke.sh

  # ============================================================================
  # RELEASE GATE (push to main only, after PR approval & merge)
  # Stages 6 & 7 execute strictly on push to main
  # ============================================================================

  heavy-integration-matrix:
    name: "[Stage 6] Full Monorepo Integration Matrix"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [container-certification]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run full monorepo test matrix
        env:
          JWT_SECRET: ci-test-runner-cryptographic-signing-key-32-chars
        run: |
          (cd packages/shared && node --test 'tests/**/*.test.js')
          (cd services/api && node --test 'tests/**/*.test.js')
          (cd apps/web && node --test 'tests/**/*.test.js')

  release-artifact-build:
    name: "[Stage 7] Build SHA-Pinned Release Images"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [heavy-integration-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release images pinned to the Git commit SHA
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Building release images pinned to commit SHA: ${COMMIT_SHA}"
          docker build -t "task-sphere-api:${COMMIT_SHA}" -f services/api/Dockerfile .
          docker build -t "task-sphere-web:${COMMIT_SHA}" -f apps/web/Dockerfile .

      - name: Enforce pinned image tags (reject :latest)
        run: |
          echo "Verifying that built images strictly exclude unpinned ':latest' tags..."
          if docker images | grep -q "task-sphere-api:latest"; then
            echo "FATAL: unpinned ':latest' image tags are prohibited."
            exit 1
          fi
          echo "PASS: Release artifacts pinned to immutable commit SHA ${{ github.sha }}."
